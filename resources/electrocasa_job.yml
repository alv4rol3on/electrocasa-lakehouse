resources:
  jobs:
    electrocasa_job:
      name: ElectroCasa Job

      schedule:
        quartz_cron_expression: "0 0 8 * * ?"
        timezone_id: "America/Lima"
        pause_status: UNPAUSED

      email_notifications:
        on_failure:
          - LZ4lv4roJoaqu1n@outlook.com

      tasks:
        - task_key: ingest_catalogo

          max_retries: 2
          min_retry_interval_millis: 60000

          sql_task:
            file:
              path: ../src/electrocasa/utils/ingest_catalogo.sql
              source: WORKSPACE
            warehouse_id: bb69341e7dac12fe

        - task_key: electrocasa_pipeline

          depends_on:
            - task_key: ingest_catalogo

          max_retries: 2
          min_retry_interval_millis: 60000

          pipeline_task:
            pipeline_id: ${resources.pipelines.electrocasa_pipeline.id}